<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BCS - Bogura Cyber Security</title>

<style>

*{
margin:0;
padding:0;
font-family: Arial;
scroll-behavior:smooth;
}

body{
background:black;
color:white;
}

/* Navbar */

nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 40px;
background:#111;
position:sticky;
top:0;
z-index:999;
}

.logo img{
height:50px;
border-radius:10px;
}

nav a{
color:white;
text-decoration:none;
margin-left:20px;
font-weight:bold;
}

nav a:hover{
color:red;
}

/* Hero */

.hero{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;

background:linear-gradient(rgba(0,0,0,.8),rgba(0,0,0,.8)),
url("https://images.unsplash.com/photo-1563986768609-322da13575f3");
background-size:cover;
background-position:center;
}

.hero h1{
font-size:55px;
color:red;
}

.hero p{
font-size:20px;
margin:20px 0;
}

.hero button{
padding:15px 30px;
border:none;
border-radius:30px;
background:red;
color:white;
font-size:16px;
cursor:pointer;
}
  <div style="
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
text-align:center;
color:red;
font-size:40px;
font-weight:bold;
opacity:0.8;
pointer-events:none;
">

🔐 Bogura Cyber Security - BCS<br>
Protecting Digital Security

</div>

/* Services */

.section{
padding:80px 40px;
text-align:center;
}

.section h2{
color:red;
margin-bottom:40px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:25px;
}

.card{
background:#111;
padding:25px;
border-radius:15px;
border:1px solid red;
transition:.3s;
}

.card:hover{
transform:translateY(-10px);
box-shadow:0 0 20px red;
}

/* Footer */

footer{
text-align:center;
padding:20px;
background:#111;
margin-top:40px;
}

</style>
</head>

<body>

<nav>

<div class="logo">
<img src="logo.png">
</div>

<div>
<a href="#">Home</a>
<a href="#services">Services</a>
<a href="#contact">Contact</a>
</div>

</nav>

<section class="hero">
<h1>Bogura Cyber Security</h1>
<p>Protecting Your Digital Security</p>
<button onclick="location.href='#contact'">Contact Us</button>
</section>

<section class="section" id="services">
<h2>Our Services</h2>

<div class="cards">

<div class="card">
<h3>Facebook Recovery</h3>
<p>Account security & recovery</p>
</div>

<div class="card">
<h3>Post Removal</h3>
<p>Remove harmful content</p>
</div>

<div class="card">
<h3>Security Support</h3>
<p>24/7 help service</p>
</div>

</div>
</section>

<section class="section" id="contact">
<h2>Contact Us</h2>
<p>Need help? Contact our team</p>
<br>
<button style="padding:14px 30px;background:red;color:white;border:none;border-radius:25px;"
onclick="window.open('https://wa.me/880XXXXXXXXXX')">
WhatsApp Contact
</button>
</section>

<footer>
<p>© 2026 Bogura Cyber Security - BCS</p>
</footer>

</body>
</html>
